spring:
  application:
    name: orders-kafka-stream
  kafka:
    streams:
      bootstrap-servers: localhost:9092,localhost:9094,localhost:9096
      application-id: orders-kafka-stream
    properties:
      default:
        deserialization:
          exception:
        #            handler: org.apache.kafka.streams.errors.LogAndContinueExceptionHandler
        #            handler: com.kafka.streams.app.exception.StreamsDeserializationErrorHandler
        production:
          exception:
            handler: com.kafka.streams.app.exception.StreamsProductionErrorHandler

topic:
  greetings:
    input:
      name: greetings
    output:
      name: greetings-output

