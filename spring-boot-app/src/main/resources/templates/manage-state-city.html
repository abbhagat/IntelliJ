<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<fieldset>
    <head>
        <style>
            table {
                width: 30%;
            }

            table td, table th {
                border: 2px solid grey;
            }

            table th {
                background: #eee;
            }
        </style>
        <title>
            <th:block th:text="${PAGE_TITLE}"/>
        </title>
        <div>
            <h1>
                <center>Manage State City</center>
            </h1>
            <br/>
        </div>

        <div class="row">
            <form method="post" th:action="@{/stateCity/searchStateCity}" th:object="${stateCity}">
                State: <input id="state" th:field="*{state}" type="text">&emsp;
                City: <input id="city" th:field="*{city}" type="text">
                &emsp;&emsp;&emsp;&emsp;
                <input type="submit" value="Search"/>&emsp;
                <input id="btnClear" onclick="clearSearch()" type="button" value="Clear"/><br/>
            </form>
        </div>
    </head>
    <body>
    <br/><br/>
    <form action="#" method="post" th:action="@{/stateCity/performAction}" th:object="${stateCityList}">
        <div class="container my-5" th:switch="${stateCityList}">
            <div class="row">
                <div class="col-md-6">
                    <h2 th:case="null">No State City Details</h2>
                    <div th:case="*">
                        <h2 class="my-5">State City Details</h2>
                        <br/>
                        <input th:id="save" th:name="action" th:value="Save" type="submit">&emsp;
                        <input th:id="create" th:name="action" th:value="Create" type="submit">&emsp;
                        <input th:id="cancel" th:name="action" th:value="Cancel" type="submit">&emsp;
                        <input th:id="export" th:name="action" th:value="Export" type="submit">&emsp;
                        <div style="height: 300px; overflow: auto">
                            <table class="table table-striped table-responsive-md" th:border="3">
                                <thead>
                                <tr>
                                    <th> SN</th>
                                    <th> State</th>
                                    <th> City</th>
                                    <th> Delete</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="stateCity, iteration : *{listOfStateCity}">
                                    <td th:text="${iteration.index} + 1"></td>
                                    <input th:field="*{listOfStateCity[__${iteration.index}__].stateCityID}" th:id="id"
                                           th:type="hidden">
                                    <td><input th:field="*{listOfStateCity[__${iteration.index}__].state}"/></td>
                                    <td><input th:field="*{listOfStateCity[__${iteration.index}__].city}"/></td>
                                    <td>
                                        <a th:href="@{/stateCity/deleteStateCity/{stateCityID}(stateCityID=*{listOfStateCity[__${iteration.index}__].stateCityID})}"
                                           th:text="Delete"></a></td>
                                    <td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </form>
    </body>
</fieldset>
</html>

<script type="text/javascript">
  function clearSearch() {
    window.location = "[[@{/stateCity/getAllStateCity}]]";
  }

</script>
