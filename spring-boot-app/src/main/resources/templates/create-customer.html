<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>
        <th:block th:text="${CREATE_CUSTOMER}"/>
    </title>
</head>
<body>
<div>
    <meta charset="utf-8">
    <meta content="ie=edge" http-equiv="x-ua-compatible">
    <h1>Enter Employee Details</h1><br/>
</div>
<div>
    <form method="post" th:action="@{/customer/performAction}" th:object="${customer}">
        <div class="row">
            <fieldset>
                <p></p>
                <div class="form-group col-md-6">
                    <label class="col-form-label" for="firstName">First Name</label>
                    <input class="form-control" id="firstName" th:field="*{firstName}" type="text">
                    <span class="text-danger" th:errors="*{firstName}" th:if="${#fields.hasErrors('firstName')}"></span>
                    &emsp;&emsp;&emsp;&emsp;
                    <label class="col-form-label" for="middleName">Middle Name</label>
                    <input class="form-control" id="middleName" th:field="*{middleName}" type="text">
                    <span class="text-danger" th:errors="*{middleName}"
                          th:if="${#fields.hasErrors('middleName')}"></span>
                    &emsp;&emsp;&emsp;&emsp;
                    <label class="col-form-label" for="lastName">Last Name</label>
                    <input class="form-control" id="lastName" th:field="*{lastName}" type="text">
                    <span class="text-danger" th:errors="*{lastName}" th:if="${#fields.hasErrors('lastName')}"></span>
                    &emsp;&emsp;&emsp;&emsp;
                    <label class="col-form-label" for="dob">Date of Birth&ensp;</label>
                    <input id="dob" th:class="form-control" th:field="*{dob}" th:pattern="dd-MMM-yyyy" th:type="date">
                    <span class="text-danger" th:errors="*{dob}" th:if="${#fields.hasErrors('dob')}"></span>
                    <p></p><br/><br/>

                    <label class="col-form-label" for="gender">Gender&emsp;&ensp;</label>
                    <input class="form-control" id="gender" th:field="*{gender}" type="text">
                    <span class="text-danger" th:errors="*{gender}" th:if="${#fields.hasErrors('gender')}"></span>
                    &emsp;&emsp;&emsp;&emsp;&emsp;
                    <label class="col-form-label" for="phoneNumber">Phone&emsp;&emsp;</label>
                    <input class="form-control" id="phoneNumber" th:field="*{phoneNumber}" type="text">
                    <span class="text-danger" th:errors="*{phoneNumber}"
                          th:if="${#fields.hasErrors('phoneNumber')}"></span>
                    &emsp;&emsp;&emsp;&emsp;
                    <label class="col-form-label" for="email">Email&emsp;&emsp;</label>
                    <input class="form-control" id="email" th:field="*{email}" type="text">
                    <span class="text-danger" th:errors="*{email}" th:if="${#fields.hasErrors('email')}"></span>
                    &emsp;&emsp;&emsp;&emsp;
                    <label class="col-form-label" for="maritalStatus">Marital Status</label>
                    <input class="form-control" id="maritalStatus" th:field="*{maritalStatus}" type="text">
                    <span class="text-danger" th:errors="*{email}" th:if="${#fields.hasErrors('maritalStatus')}"></span>
                    <p></p><br/>
                    <label class="col-form-label" for="fatherName">Father Name</label>
                    <input class="form-control" id="fatherName" th:field="*{fatherName}" type="text">
                    <span class="text-danger" th:errors="*{fatherName}"
                          th:if="${#fields.hasErrors('fatherName')}"></span>
                    &emsp;&emsp;&emsp;&emsp;
                    <label class="col-form-label" for="motherName">Mother Name</label>
                    <input class="form-control" id="motherName" th:field="*{motherName}" type="text">
                    <span class="text-danger" th:errors="*{motherName}"
                          th:if="${#fields.hasErrors('motherName')}"></span>
                    &emsp;

                    <label class="col-form-label" for="presentAddress">Present Address</label>
                    <textarea class="form-control" cols="20" id="presentAddress" rows="5"
                              th:field="*{presentAddress}"></textarea>
                    <span class="text-danger" th:errors="*{presentAddress}"
                          th:if="${#fields.hasErrors('presentAddress')}"></span>
                    &emsp;&emsp;&emsp;
                    <label class="col-form-label" for="permanentAddress">Permanent Address</label>
                    <textarea class="form-control" cols="20" id="permanentAddress" rows="5"
                              th:field="*{permanentAddress}"></textarea>
                    <span class="text-danger" th:errors="*{permanentAddress}"
                          th:if="${#fields.hasErrors('permanentAddress')}"></span>
                    <p></p><br/><br/>

                    <label class="col-form-label" for="stateCityID">State City Id &ensp;&nbsp;&nbsp;</label>
                    <input class="form-control" id="stateCityID" th:field="*{stateCityID}" type="text">
                    <span class="text-danger" th:errors="*{stateCityID}"
                          th:if="${#fields.hasErrors('stateCityID')}"></span>
                    &emsp;&emsp;&emsp;&emsp;
                    <label class="col-form-label" for="pinCode">Pin Code &ensp;&nbsp;</label>
                    <input class="form-control" id="pinCode" th:field="*{pinCode}" type="text">
                    <span class="text-danger" th:errors="*{pinCode}" th:if="${#fields.hasErrors('pinCode')}"></span>
                    <p></p><br/><br/>
                </div>
            </fieldset>
        </div>
        <p></p><br/>
        <div class="row">
            <div class="col-md-6 mt-5">
                <input th:id="save" th:name="action" th:type="submit" th:value="Save">&emsp;
            </div>
        </div>
    </form>
</div>
</body>
</html>
