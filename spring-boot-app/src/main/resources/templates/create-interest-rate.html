<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>
        <th:block th:text="${manageInterestRate}"/>
    </title>
</head>
<body>
<div><h1>Enter Interest Rate Details</h1><br/></div>
<div>
    <form method="post" th:action="@{/interestRate/saveInterestRate}" th:object="${interestRates}">

        <label>Interest Rate</label> <input id="interestRate" th:field="*{interestRate}" type="text">
        &emsp;&emsp;&emsp;&emsp;
        <label>Months</label> <input id="months" th:field="*{months}" type="text">
        &emsp;&emsp;&emsp;&emsp;
        <label>Years</label> <input id="email" th:field="*{years}" type="text">

        <label>Days</label> <input id="phoneNumber" th:field="*{days}" type="text">
        <input th:id="save" th:name="action" th:type="submit" th:value="Save">&emsp;
    </form>
</div>
</body>
</html>
