apiVersion: apps/v1
kind: Deployment
metadata:
  name: department-service
spec:
  replicas: 3

  selector:
    matchLabels:
      app: department-service

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  template:
    metadata:
      labels:
        app: department-service

    spec:
      terminationGracePeriodSeconds: 30

      containers:
        - name: department-service
          image: your-registry/department-service:1.0.0

          ports:
            - containerPort: 8080

          env:
            - name: REDIS_HOST
              value: "your-managed-redis-private-endpoint"

            - name: REDIS_PORT
              value: "6379"

            - name: REDIS_USERNAME
              valueFrom:
                secretKeyRef:
                  name: department-service-secrets
                  key: redis-username

            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: department-service-secrets
                  key: redis-password

            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: department-service-secrets
                  key: db-url

            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: department-service-secrets
                  key: db-username

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: department-service-secrets
                  key: db-password

          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"

          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 5
            failureThreshold: 30

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 10
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: department-service
spec:
  selector:
    app: department-service

  ports:
    - port: 80
      targetPort: 8080

  type: ClusterIP