spring:
  application:
    name: spring-boot-redis-app
  banner:
    location: classpath:banner.txt
  data:
    redis:
#      cluster:
#        nodes:
#          - ${REDIS_CONFIGURATION_ENDPOINT}:${REDIS_PORT:6379}
#        max-redirects: 5
      ssl:
        enabled: true
      host: localhost
      port: 6379
      username:
      password: mypassword
      timeout: 2s
      connect-timeout: 2s
  datasource:
    url: jdbc:oracle:thin:@localhost:1521:XE
    driver-class-name: oracle.jdbc.OracleDriver
    username: system
    password: zed
  jpa:
    properties:
      hibernate:
        format_sql: true
        enable_lazy_load_no_trans: true
    show-sql: true
    hibernate:
      ddl-auto: update
  cache:
    type: redis
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n"
  level:
    org:
      hibernate:
        SQL: debug
      type:
        descriptor:
          sql: trace
server:
  port: 8085
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never